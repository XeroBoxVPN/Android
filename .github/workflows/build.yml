# Builds the VPN core (./core) and the app. On every push: a debug APK (proves the repository
# builds from scratch). On a tag v*: signed release APKs, attached to a GitHub release with
# SHA-256 checksums.
#
# Repository settings → Secrets and variables → Actions:
#   variables: XEROBOX_SERVER_URL (https://api.example.com), XEROBOX_DOWNLOAD_URL (optional,
#              the download page shown as a QR code until the panel sends one)
#   secrets (release only): KEYSTORE_BASE64 (the signing .jks, base64), KEYSTORE_PASS,
#              ALIAS_NAME, ALIAS_PASS
name: build

on:
  push:
    branches: [main-xerobox]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # create releases on tags

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Install the NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.0.13004108" > /dev/null

      - name: Build libbox
        working-directory: core
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.0.13004108
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          export PATH="$(go env GOPATH)/bin:$PATH"
          export XEROBOX_CORE_VERSION="$(grep ^CORE_VERSION= ../version.properties | cut -d= -f2 | tr -d '\r')-$(git rev-parse --short HEAD)"
          go run ./cmd/internal/build_libbox -target android
          mkdir -p ../app/libs
          cp libbox.aar ../app/libs/

      - name: Check the tag matches version.properties (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          name="$(grep ^VERSION_NAME= version.properties | cut -d= -f2 | tr -d '\r')"
          if [ "${{ github.ref_name }}" != "v$name" ]; then
            echo "Tag ${{ github.ref_name }} does not match VERSION_NAME=$name (expected v$name)"
            exit 1
          fi

      - name: Configure
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "XEROBOX_SERVER_URL=${{ vars.XEROBOX_SERVER_URL }}"
            echo "XEROBOX_DOWNLOAD_URL=${{ vars.XEROBOX_DOWNLOAD_URL }}"
            echo "XEROBOX_GITHUB_REPO=${{ github.repository }}"
          } > local.properties

      - name: Signing key (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PASS=$KEYSTORE_PASS"
            echo "ALIAS_NAME=$ALIAS_NAME"
            echo "ALIAS_PASS=$ALIAS_PASS"
          } >> local.properties

      - name: Debug build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Release build
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect outputs
        run: |
          mkdir out
          find app/build/outputs -name "*.apk" -exec cp {} out/ \;
          code="$(grep ^VERSION_CODE= version.properties | cut -d= -f2 | tr -d '\r')"
          name="$(grep ^VERSION_NAME= version.properties | cut -d= -f2 | tr -d '\r')"
          # Read by the app's GitHub update check (GitHubUpdateChecker.kt) on every release.
          printf '{"version_code": %s, "version_name": "%s"}\n' "$code" "$name" > out/XeroBox-version-metadata.json
          cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: xerobox-android-${{ github.sha }}
          path: out/
          retention-days: 14

      - name: GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "XeroBox ${{ github.ref_name }}" \
            --notes "Download the APK for your phone (arm64-v8a for most phones, armeabi-v7a for older ones). Verify with SHA256SUMS.txt." \
            out/*.apk out/XeroBox-version-metadata.json out/SHA256SUMS.txt
